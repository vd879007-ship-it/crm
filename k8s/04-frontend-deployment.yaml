apiVersion: apps/v1
kind: Deployment
metadata:
  name: athena-frontend
  namespace: athena-enterprise
  labels:
    app.kubernetes.io/name: athena-frontend
    app.kubernetes.io/part-of: athena-teams
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: athena-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: athena-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/enterprise/athena-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: athena-frontend-service
  namespace: athena-enterprise
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: athena-frontend
  ports:
    - port: 80
      targetPort: http
      name: http
